tags: [User]
summary: 更換密碼
description: |
  驗證舊密碼後更換新密碼。純 LINE 帳號（無 EMAIL provider）無法使用此端點。
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [oldPassword, newPassword]
        properties:
          oldPassword:
            type: string
            format: password
            maxLength: 128
            example: OldPass123!
          newPassword:
            type: string
            format: password
            maxLength: 128
            example: NewPass456@
responses:
  '204':
    description: 密碼更換成功
  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'
  '401':
    $ref: '../openapi.yaml#/components/responses/Unauthorized'
  '422':
    description: 帳號無 EMAIL provider（純 LINE 使用者）
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 此帳號未設定 EMAIL 登入，無法更換密碼
          code: NO_EMAIL_PROVIDER
          timestamp: '2024-01-01T00:00:00.000Z'
