openapi: 3.0.0

info:
  title: JoinBar API
  version: 1.0.0
  description: |
    JoinBar 酒吧社交平台 API 文件

    ## 認證

    大多數 API 需要 JWT Bearer Token 認證。

    **步驟：**
    1. 呼叫 `POST /api/auth/login` 取得 `data.accessToken` 與 `data.refreshToken`
    2. 點擊右上角 **Authorize** 按鈕
    3. 輸入 `Bearer {accessToken}` 後按 Authorize

servers:
  - url: http://localhost:3000/api
    description: 本地開發環境

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      required: [success, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'

    ErrorResponse:
      type: object
      required: [success, timestamp]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 發生錯誤
        code:
          type: string
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'

  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 缺少或無效的授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  # ─── Auth ─────────────────────────────────
  /auth/login:
    post:
      $ref: './auth/login.yaml'

  /auth/logout:
    post:
      $ref: './auth/logout.yaml'

  /auth/refresh:
    post:
      $ref: './auth/refresh.yaml'

  /auth/line:
    post:
      $ref: './auth/line-login.yaml'

  /auth/register:
    post:
      $ref: './auth/register.yaml'

  /auth/password-reset/request:
    post:
      $ref: './auth/password-reset-request.yaml'

  /auth/password-reset/confirm:
    post:
      $ref: './auth/password-reset-confirm.yaml'

  /auth/verify-email:
    post:
      $ref: './auth/verify-email.yaml'

  # ─── 其他模組（尚未實作）────────────────────
