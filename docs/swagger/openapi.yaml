openapi: 3.0.0

info:
  title: JoinBar API
  version: 1.0.0
  description: |
    JoinBar 酒吧社交平台 API 文件

    ## 認證

    大多數 API 需要 JWT Bearer Token 認證。

    **步驟：**
    1. 呼叫 `POST /api/auth/login` 取得 `data.accessToken` 與 `data.refreshToken`
    2. 點擊右上角 **Authorize** 按鈕
    3. 輸入 `Bearer {accessToken}` 後按 Authorize

servers:
  - url: http://localhost:3000/api
    description: 本地開發環境

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      required: [success, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'

    ErrorResponse:
      type: object
      required: [success, timestamp]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 發生錯誤
        code:
          type: string
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'

  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 缺少或無效的授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  # ─── Auth ─────────────────────────────────
  /auth/register:
    post:
      $ref: './auth/register.yaml'

  /auth/login:
    post:
      $ref: './auth/login.yaml'

  /auth/logout:
    post:
      $ref: './auth/logout.yaml'

  /auth/refresh:
    post:
      $ref: './auth/refresh.yaml'

  /auth/line/url:
    get:
      $ref: './auth/line-url.yaml'

  /auth/line/callback:
    get:
      $ref: './auth/line-callback.yaml'

  /auth/google:
    post:
      $ref: './auth/google.yaml'

  /auth/verify-email:
    get:
      $ref: './auth/verify-email.yaml'

  # ─── Users ────────────────────────────────
  /users/me:
    get:
      $ref: './users/get-me.yaml'
    patch:
      $ref: './users/update-me.yaml'

  /users/me/avatar:
    post:
      $ref: './users/upload-avatar.yaml'

  /users/me/tags:
    put:
      $ref: './users/update-tags.yaml'

  # ─── Bars ─────────────────────────────────
  /bars:
    get:
      $ref: './bars/list.yaml'

  /bars/{id}:
    get:
      $ref: './bars/get.yaml'

  /bars/recommend:
    get:
      $ref: './bars/recommend.yaml'

  # ─── Events ───────────────────────────────
  /events:
    get:
      $ref: './events/list.yaml'
    post:
      $ref: './events/create.yaml'

  /events/{id}:
    get:
      $ref: './events/get.yaml'
    patch:
      $ref: './events/update.yaml'
    delete:
      $ref: './events/delete.yaml'

  /events/{id}/join:
    post:
      $ref: './events/join.yaml'
    delete:
      $ref: './events/leave.yaml'

  /events/{id}/messages:
    get:
      $ref: './events/list-messages.yaml'
    post:
      $ref: './events/create-message.yaml'

  /events/{id}/messages/{messageId}:
    delete:
      $ref: './events/delete-message.yaml'

  # ─── Cart ─────────────────────────────────
  /cart:
    get:
      $ref: './cart/list.yaml'
    post:
      $ref: './cart/add.yaml'

  /cart/{id}:
    delete:
      $ref: './cart/remove.yaml'

  # ─── Orders ───────────────────────────────
  /orders:
    get:
      $ref: './orders/list.yaml'

  /orders/{id}:
    get:
      $ref: './orders/get.yaml'

  # ─── LINE Pay ─────────────────────────────
  /linepay/request:
    post:
      $ref: './linepay/request.yaml'

  /linepay/confirm:
    get:
      $ref: './linepay/confirm.yaml'

  /linepay/cancel:
    get:
      $ref: './linepay/cancel.yaml'

  # ─── Subscriptions ────────────────────────
  /subscriptions:
    get:
      $ref: './subscriptions/list.yaml'

  /subscriptions/plans:
    get:
      $ref: './subscriptions/plans.yaml'

  # ─── Benefits ─────────────────────────────
  /benefits:
    get:
      $ref: './benefits/list.yaml'

  /benefits/{id}/redeem:
    post:
      $ref: './benefits/redeem.yaml'

  # ─── Favorites ────────────────────────────
  /favorites/bars:
    get:
      $ref: './favorites/list-bars.yaml'
    post:
      $ref: './favorites/add-bar.yaml'

  /favorites/bars/{id}:
    delete:
      $ref: './favorites/remove-bar.yaml'

  /favorites/events:
    get:
      $ref: './favorites/list-events.yaml'
    post:
      $ref: './favorites/add-event.yaml'

  /favorites/events/{id}:
    delete:
      $ref: './favorites/remove-event.yaml'

  # ─── Notifications ────────────────────────
  /notifications:
    get:
      $ref: './notifications/list.yaml'

  /notifications/{id}/read:
    patch:
      $ref: './notifications/read.yaml'
