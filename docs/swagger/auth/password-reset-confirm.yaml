tags: [Auth]
summary: 確認密碼重設
description: |
  使用重設 token 更新密碼。Token 使用後立即作廢。
  APPLICATION_IS_LOGOUT_AFTER_PASSWORD_RESET 啟用時，所有現有 session 將被清除。
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [token, newPassword]
        properties:
          token:
            type: string
            description: 密碼重設 token（從重設信取得）
            example: a3f8b2c1d4e5...（64 字元 hex）
          newPassword:
            type: string
            format: password
            minLength: 8
            maxLength: 128
            example: NewSecurePass1!
responses:
  '204':
    description: 密碼重設成功
  '400':
    description: Token 無效、已使用或已過期
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 密碼重設 token 無效或已過期
          code: INVALID_PASSWORD_RESET_TOKEN
          timestamp: '2024-01-01T00:00:00.000Z'
  '403':
    description: 帳號已停用
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
