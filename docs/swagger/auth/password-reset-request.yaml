tags: [Auth]
summary: 請求密碼重設
description: |
  對指定 Email 寄送密碼重設連結。
  無論 Email 是否存在，一律回傳 204（防止 Email 列舉攻擊）。
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email]
        properties:
          email:
            type: string
            format: email
            maxLength: 100
            example: user@example.com
responses:
  '204':
    description: 請求已接收（無論 Email 是否存在）
  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
