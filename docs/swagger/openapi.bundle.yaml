openapi: 3.0.0
info:
  title: JoinBar API
  version: 1.0.0
  description: |
    JoinBar 酒吧社交平台 API 文件

    ## 認證

    大多數 API 需要 JWT Bearer Token 認證。

    **步驟：**
    1. 呼叫 `POST /api/auth/login` 取得 `data.accessToken` 與 `data.refreshToken`
    2. 點擊右上角 **Authorize** 按鈕
    3. 輸入 `Bearer {accessToken}` 後按 Authorize
servers:
  - url: 'http://localhost:3000/api'
    description: 本地開發環境
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
    ErrorResponse:
      type: object
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 發生錯誤
        code:
          type: string
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 缺少或無效的授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: 登入
      description: |
        使用 Email 與密碼登入，成功後取得 Access Token + Refresh Token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 100
                  example: user@example.com
                password:
                  type: string
                  format: password
                  maxLength: 128
                  example: MyPass123!
                recaptchaToken:
                  type: string
                  description: reCAPTCHA Token（googleRecaptchaEnabled 啟用時必填）
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 7200
                  refreshTokenExpiresIn: 604800
                  user:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    email: user@example.com
                    username: alan
                    role: USER
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 帳號或密碼錯誤
                code: UNAUTHORIZED
                timestamp: '2024-01-01T00:00:00.000Z'
        '403':
          description: 帳號已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 帳號已被停用，請聯繫管理員
                code: ACCOUNT_DISABLED
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 登出
      description: |
        登出並將 Access Token 加入黑名單，若提供 Refresh Token 則一併加入。
        需要 JWT Bearer Token 認證。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token（選填）
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: 登出成功（無 body）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 更新 Access Token
      description: |
        使用有效的 Refresh Token 換發新 Access Token。
        Refresh Token 本身不旋轉（絕對 7 天有效）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: 換發成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 7200
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 無效的 Refresh Token（已過期、格式錯誤、已在黑名單）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 無效的 Refresh Token，請重新登入
                code: INVALID_REFRESH_TOKEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '403':
          description: 帳號已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/line:
    post:
      tags:
        - Auth
      summary: LINE 登入
      description: |
        使用 LINE authorization code 登入。
        使用者不存在時自動建立新帳號（upsert），存在則更新 LINE provider 資料。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - redirectUri
              properties:
                code:
                  type: string
                  description: LINE authorization code
                  example: 1234567890abcdef
                redirectUri:
                  type: string
                  format: uri
                  description: OAuth redirect URI（必須與 LINE Channel 設定一致）
                  example: 'https://app.example.com/auth/line/callback'
      responses:
        '200':
          description: LINE 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 7200
                  refreshTokenExpiresIn: 604800
                  user:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    email: null
                    username: Alan
                    role: USER
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: LINE 授權碼無效或已過期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 帳號已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      tags:
        - Auth
      summary: 註冊
      description: |
        使用 Email + 密碼建立新帳號。
        若 emailVerificationEnabled 啟用，回傳 verified=false 並寄送驗證信。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 100
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  example: MyPass123!
                username:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: alan_t
      responses:
        '201':
          description: 註冊成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  verified: false
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email 已被註冊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Email 已被註冊
                code: EMAIL_ALREADY_EXISTS
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password-reset/request:
    post:
      tags:
        - Auth
      summary: 請求密碼重設
      description: |
        對指定 Email 寄送密碼重設連結。
        無論 Email 是否存在，一律回傳 204（防止 Email 列舉攻擊）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 100
                  example: user@example.com
      responses:
        '204':
          description: 請求已接收（無論 Email 是否存在）
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password-reset/confirm:
    post:
      tags:
        - Auth
      summary: 確認密碼重設
      description: |
        使用重設 token 更新密碼。Token 使用後立即作廢。
        APPLICATION_IS_LOGOUT_AFTER_PASSWORD_RESET 啟用時，所有現有 session 將被清除。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: 密碼重設 token（從重設信取得）
                  example: a3f8b2c1d4e5...（64 字元 hex）
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  example: NewSecurePass1!
      responses:
        '204':
          description: 密碼重設成功
        '400':
          description: Token 無效、已使用或已過期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 密碼重設 token 無效或已過期
                code: INVALID_PASSWORD_RESET_TOKEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '403':
          description: 帳號已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/verify-email:
    post:
      tags:
        - Auth
      summary: 驗證 Email
      description: |
        使用驗證 token 完成 Email 驗證。Token 來自註冊時寄送的驗證信。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Email 驗證 token（從驗證信取得）
                  example: b7e9a1f3c2d8...（64 字元 hex）
      responses:
        '204':
          description: Email 驗證成功
        '400':
          description: Token 無效或已過期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Email 驗證 token 無效或已過期
                code: INVALID_EMAIL_VERIFICATION_TOKEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      tags:
        - User
      summary: 取得個人資料
      description: 回傳目前登入使用者的完整 profile。
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 00000000-0000-0000-0000-000000000001
                  email: user@example.com
                  username: alice
                  nickname: 小愛
                  role: USER
                  birthday: '1990-01-01T00:00:00.000Z'
                  avatarUrl: 'https://storage.googleapis.com/signed/avatar.jpg'
                  createdAt: '2024-01-01T00:00:00.000Z'
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - User
      summary: 更新個人資料
      description: |
        更新 username、nickname、birthday（三者皆為可選）。
        至少需提供一個欄位，否則回傳 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: alice
                nickname:
                  type: string
                  maxLength: 100
                  example: 小愛
                birthday:
                  type: string
                  format: date
                  example: '1990-01-01'
      responses:
        '200':
          description: 更新成功，回傳更新後 profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 00000000-0000-0000-0000-000000000001
                  email: user@example.com
                  username: alice
                  nickname: 小愛
                  role: USER
                  birthday: '1990-01-01T00:00:00.000Z'
                  avatarUrl: null
                  createdAt: '2024-01-01T00:00:00.000Z'
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - User
      summary: 刪除帳號
      description: |
        軟刪除自身帳號（設定 deletedAt），並清除 Redis UserContext 快取。
        刪除後使用同一 JWT 再次請求任何需認證 API 將回傳 403。
      responses:
        '204':
          description: 帳號刪除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/password:
    post:
      tags:
        - User
      summary: 更換密碼
      description: |
        驗證舊密碼後更換新密碼。純 LINE 帳號（無 EMAIL provider）無法使用此端點。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  format: password
                  maxLength: 128
                  example: OldPass123!
                newPassword:
                  type: string
                  format: password
                  maxLength: 128
                  example: NewPass456@
      responses:
        '204':
          description: 密碼更換成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 帳號無 EMAIL provider（純 LINE 使用者）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 此帳號未設定 EMAIL 登入，無法更換密碼
                code: NO_EMAIL_PROVIDER
                timestamp: '2024-01-01T00:00:00.000Z'
  /users/me/avatar:
    post:
      tags:
        - User
      summary: 上傳頭像
      description: |
        上傳圖片至 Firebase Storage，更新 avatarUrl、avatarKey、avatarLastUpdated。
        若使用者已有頭像，會先刪除舊檔再上傳新檔。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 圖片檔案（image/*）
      responses:
        '200':
          description: 上傳成功，回傳新的 avatarUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  avatarUrl: 'https://storage.googleapis.com/signed/avatars/user-id/1234567890.jpg'
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 檔案類型非 image/*
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 檔案類型必須為圖片（image/*）
                code: UNPROCESSABLE_ENTITY
                timestamp: '2024-01-01T00:00:00.000Z'
    delete:
      tags:
        - User
      summary: 刪除頭像
      description: |
        刪除 Firebase Storage 上的頭像檔案，清空 avatarUrl、avatarKey、avatarLastUpdated。
        若使用者本無頭像，冪等回傳 204。
      responses:
        '204':
          description: 頭像刪除成功（或本無頭像）
        '401':
          $ref: '#/components/responses/Unauthorized'
  /bars:
    get:
      tags:
        - Bar
      summary: 列出酒吧
      description: |
        公開端點，無需登入。
        支援標籤篩選（OR 邏輯）與關鍵字搜尋，回傳分頁結果。
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: keyword
          in: query
          description: 對 name、address 做模糊搜尋
          schema:
            type: string
            example: 台北
        - name: tags
          in: query
          description: '逗號分隔的標籤名稱，合法值：sport, music, student, bistro, drink, joy, romantic, oldschool, highlevel, easy'
          schema:
            type: string
            example: 'sport,music'
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  items:
                    - id: 00000000-0000-0000-0000-000000000001
                      name: 運動酒吧
                      address: 台北市信義區
                      phone: 02-1234-5678
                      website: null
                      imageUrl: null
                      latitude: 25.033
                      longitude: 121.565
                      tags:
                        - sport
                        - drink
                  meta:
                    page: 1
                    limit: 20
                    total: 1
                    totalPages: 1
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Bar
      summary: 建立酒吧
      description: 需 JWT。建立酒吧記錄，可選附帶 BarTag。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: 新潮酒吧
                address:
                  type: string
                  maxLength: 255
                  example: 台北市大安區忠孝東路
                phone:
                  type: string
                  maxLength: 20
                  example: 02-8765-4321
                website:
                  type: string
                  format: uri
                  example: 'https://bar.example.com'
                imageUrl:
                  type: string
                  format: uri
                latitude:
                  type: number
                  example: 25.041
                longitude:
                  type: number
                  example: 121.545
                googlePlaceId:
                  type: string
                  example: ChIJexampleplaceid
                tags:
                  type: object
                  properties:
                    sport:
                      type: boolean
                    music:
                      type: boolean
                    student:
                      type: boolean
                    bistro:
                      type: boolean
                    drink:
                      type: boolean
                    joy:
                      type: boolean
                    romantic:
                      type: boolean
                    oldschool:
                      type: boolean
                    highlevel:
                      type: boolean
                    easy:
                      type: boolean
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 00000000-0000-0000-0000-000000000002
                  name: 新潮酒吧
                  address: 台北市大安區忠孝東路
                  phone: 02-8765-4321
                  website: 'https://bar.example.com'
                  imageUrl: null
                  latitude: 25.041
                  longitude: 121.545
                  googlePlaceId: ChIJexampleplaceid
                  tags:
                    - music
                    - romantic
                  createdAt: '2024-01-01T00:00:00.000Z'
                  updatedAt: '2024-01-01T00:00:00.000Z'
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/bars/{id}':
    get:
      tags:
        - Bar
      summary: 取得酒吧詳情
      description: 公開端點，無需登入。回傳指定酒吧的完整資訊（含標籤）。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 00000000-0000-0000-0000-000000000001
                  name: 運動酒吧
                  address: 台北市信義區松仁路
                  phone: 02-1234-5678
                  website: 'https://example.com'
                  imageUrl: null
                  latitude: 25.033
                  longitude: 121.565
                  googlePlaceId: ChIJexampleplaceid
                  tags:
                    - sport
                    - drink
                  createdAt: '2024-01-01T00:00:00.000Z'
                  updatedAt: '2024-01-01T00:00:00.000Z'
                timestamp: '2024-01-01T00:00:00.000Z'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Bar
      summary: 更新酒吧
      description: |
        需 JWT。部分更新酒吧資料，至少需提供一個欄位。
        若帶 tags 則整體覆寫 BarTag（upsert）。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                address:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 20
                website:
                  type: string
                  format: uri
                imageUrl:
                  type: string
                  format: uri
                latitude:
                  type: number
                longitude:
                  type: number
                googlePlaceId:
                  type: string
                tags:
                  type: object
                  properties:
                    sport:
                      type: boolean
                    music:
                      type: boolean
                    student:
                      type: boolean
                    bistro:
                      type: boolean
                    drink:
                      type: boolean
                    joy:
                      type: boolean
                    romantic:
                      type: boolean
                    oldschool:
                      type: boolean
                    highlevel:
                      type: boolean
                    easy:
                      type: boolean
      responses:
        '200':
          description: 更新成功，回傳更新後酒吧資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Bar
      summary: 刪除酒吧
      description: 需 JWT。對酒吧執行軟刪除（設定 deletedAt）。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 刪除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  '/bars/{id}/describe':
    post:
      tags:
        - Bar
      summary: AI 生成酒吧描述
      description: |
        需 JWT。呼叫 Gemini API 依酒吧名稱、地址、標籤生成自然語言介紹文字。
        `geminiEnabled=false` 或 Gemini API 失敗時回傳 503。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  description: 這是一間充滿活力的運動酒吧，位於台北市信義區，以體育賽事直播和精釀啤酒聞名。
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: AI 服務不可用（功能未啟用或 Gemini API 錯誤）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: AI 描述功能目前未啟用
                code: SERVICE_UNAVAILABLE
                timestamp: '2024-01-01T00:00:00.000Z'
