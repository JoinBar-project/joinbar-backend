tags: [Bar]
summary: 刪除酒吧
description: 需 JWT 且具備 ADMIN 角色。對酒吧執行軟刪除（設定 deletedAt）。
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
responses:
  '204':
    description: 刪除成功
  '401':
    $ref: '../openapi.yaml#/components/responses/Unauthorized'
  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'
  '404':
    $ref: '../openapi.yaml#/components/responses/NotFound'
