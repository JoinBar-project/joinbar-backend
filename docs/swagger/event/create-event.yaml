tags: [Event]
summary: 建立活動
description: 需 JWT。任何已登入使用者皆可建立活動，hostUser 自動設為當前使用者。若提供 tags 陣列，tag name 不存在則回傳 400。
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [name, barName, location, startAt, endAt]
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 100
            example: 週五爵士之夜
          description:
            type: string
            example: 每週五爵士樂現場演出
          barId:
            type: string
            format: uuid
          barName:
            type: string
            maxLength: 300
            example: 藍調酒吧
          location:
            type: string
            maxLength: 300
            example: 台北市大安區
          startAt:
            type: string
            format: date-time
            example: '2024-06-07T19:00:00Z'
          endAt:
            type: string
            format: date-time
            example: '2024-06-07T23:00:00Z'
          maxPeople:
            type: integer
            minimum: 1
            example: 30
          imageUrl:
            type: string
            format: uri
          price:
            type: integer
            minimum: 0
            example: 200
          tags:
            type: array
            items:
              type: string
            example: [music]
responses:
  '201':
    description: 建立成功
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'
  '401':
    $ref: '../openapi.yaml#/components/responses/Unauthorized'
