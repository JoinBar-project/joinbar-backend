tags: [Event]
summary: 更新活動
description: 需 JWT。僅 ADMIN 或活動主辦人（hostUser）可更新。至少需提供一個欄位。若提供 tags 則整體覆寫 EventTag。
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 100
          description:
            type: string
          barId:
            type: string
            format: uuid
          barName:
            type: string
            maxLength: 300
          location:
            type: string
            maxLength: 300
          startAt:
            type: string
            format: date-time
          endAt:
            type: string
            format: date-time
          maxPeople:
            type: integer
            minimum: 1
          imageUrl:
            type: string
            format: uri
          price:
            type: integer
            minimum: 0
          tags:
            type: array
            items:
              type: string
responses:
  '200':
    description: 更新成功
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'
  '401':
    $ref: '../openapi.yaml#/components/responses/Unauthorized'
  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'
  '404':
    $ref: '../openapi.yaml#/components/responses/NotFound'
